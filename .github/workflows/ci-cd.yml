name: Learning English CI/CD Pipeline

on:
  push:
    branches:
      - refactor-structure # master là branch chính của dự án

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: taidepzai/backend_learningenglish
      FRONTEND_IMAGE: taidepzai/frontend_learningenglish

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx (Giúp cache layers build Docker nhanh gấp đôi)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build & push backend Docker image
      - name: Build & push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps
          file: ./apps/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5️⃣ Build & push frontend Docker image
      - name: Build & push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./webapp/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6️⃣ Deploy lên EC2 qua SSH Action chuẩn hóa
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Chuyển vào thư mục chứa docker-compose trên EC2
            cd /home/ubuntu/app
            
            # 2. Login Docker Hub trên EC2 (Đảm bảo pull được nếu repo private)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # 3. Tự động cập nhật file .env từ GitHub Secret
            echo "${{ secrets.ENV_PRODUCTION }}" > .env
            
            # 4. Pull image mới nhất về
            docker compose -f docker-compose.prod.yml pull
            
            # 5. Cập nhật container (Zero downtime)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 6. Xóa các Docker image cũ không dùng để tiết kiệm đĩa EC2
            docker image prune -f