name: Deploy Learning English App

on:
  push:
    branches:
      - refactor-structure # master là branch chính của dự án

jobs:
  # ==========================================
  # JOB 1: BUILD & DEPLOY FRONTEND UP S3
  # ==========================================
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: |
          cd webapp
          npm ci

      - name: Build Frontend
        run: |
          cd webapp
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy static files to S3
        run: |
          # Sync thư mục dist lên S3, xóa các file cũ không còn tồn tại trên build mới
          aws s3 sync webapp/dist s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete

  # ==========================================
  # JOB 2: BUILD & DEPLOY BACKEND + REDIS TO EC2
  # ==========================================
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: taidepzai/backend_learningenglish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps
          file: ./apps/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Backend & Redis to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: ENV_CONTENT,DOCKER_PASS,DOCKER_USER
          script: |
            cd /home/ec2-user/app
            
            # Login Docker Hub trên EC2
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            
            # Cập nhật file .env
            echo "$ENV_CONTENT" > .env
            
            # Pull image backend mới nhất
            docker compose -f docker-compose.prod.yml pull backend
            
            # Restart 2 container backend và redis
            docker compose -f docker-compose.prod.yml up -d --force-recreate backend redis
            
            # Dọn dẹp image thừa để tiết kiệm bộ nhớ EC2
            docker image prune -f