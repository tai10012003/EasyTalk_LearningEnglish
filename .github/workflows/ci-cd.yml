name: Learning English CI/CD Pipeline

on:
  push:
    branches:
      - refactor-structure # master là branch chính của dự án

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: taidepzai/backend_learningenglish
      FRONTEND_IMAGE: taidepzai/frontend_learningenglish

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx (Giúp cache layers build Docker nhanh gấp đôi)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build & push backend Docker image
      - name: Build & push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps
          file: ./apps/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5️⃣ Build & push frontend Docker image
      - name: Build & push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./webapp/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6️⃣ Deploy lên EC2 qua SSH Action chuẩn hóa
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: ENV_CONTENT,DOCKER_PASS,DOCKER_USER
          script: |
            # 1. Chuyển vào thư mục app trên Amazon Linux
            cd /home/ec2-user/app
            
            # 2. Login Docker Hub trên EC2
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            
            # 3. An toàn ghi đè nội dung file .env
            echo "$ENV_CONTENT" > .env
            
            # 4. Pull image mới nhất về
            docker compose -f docker-compose.prod.yml pull
            
            # 5. Cập nhật container (Zero downtime)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 6. Xóa các Docker image cũ không dùng
            docker image prune -f